# Application stack for the Leave Application System.
# Camunda 8 itself runs separately (C8 Run or Camunda's own Docker Compose distribution)
# and is reached from the backend container through host.docker.internal.
#
#   docker compose up -d --build
#   open http://localhost:3000

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: leavedb
      POSTGRES_USER: leave
      POSTGRES_PASSWORD: leave   # local learning setup only - use secrets in production
    volumes:
      - leave-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leave -d leavedb"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/leavedb
      DB_USERNAME: leave
      DB_PASSWORD: leave
      CAMUNDA_GRPC_ADDRESS: http://host.docker.internal:26500
      CAMUNDA_REST_ADDRESS: http://host.docker.internal:8080
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8081:8081"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  leave-db:
